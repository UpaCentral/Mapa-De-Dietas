<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de Dietas</title>
<style>
*{box-sizing:border-box}
:root{
  --orange:#f08124;
  --green:#066b30;
  --ink:#1c2430;
  --muted:#667085;
  --line:#d7dde5;
  --bg:#eef2f5;
  --warn:#fff4d6;
  --danger:#ffe4e8;
}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.topbar{background:var(--orange);color:#fff;padding:12px 18px;font-size:21px;font-weight:700}
.app{display:grid;grid-template-columns:360px 1fr;gap:14px;padding:14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;box-shadow:0 2px 8px rgba(16,24,40,.08)}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:16px 0 8px}
label{display:block;font-size:12px;font-weight:700;margin-top:9px;color:#344054}
input,select,textarea{width:100%;border:1px solid #b8c0cc;border-radius:6px;padding:8px;margin-top:4px;font-size:14px;background:#fff;color:var(--ink)}
textarea{min-height:62px;resize:vertical}
.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:4px}
.check-option{display:flex;align-items:center;gap:7px;border:1px solid #b8c0cc;border-radius:6px;padding:7px 8px;background:#fff;font-size:13px}
.check-option input{width:auto;margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
button{border:0;border-radius:6px;padding:10px;background:var(--orange);color:#fff;font-weight:700;cursor:pointer;font-size:14px}
button.secondary{background:var(--green)}
button.ghost{background:#edf1f5;color:#1f2937}
button.danger{background:#b42318}
.summary{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}
.card .n{font-size:24px;font-weight:800;line-height:1}
.card .t{font-size:12px;color:var(--muted);margin-top:4px}
.toolbar{display:grid;grid-template-columns:1fr 150px 150px 120px 120px 120px 130px;gap:8px;margin-bottom:10px}
.map{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.config-panel{display:none;border:1px solid var(--line);border-radius:8px;background:#f8fafc;padding:10px;margin-bottom:10px}
.config-panel.open{display:block}
.config-panel textarea{min-height:220px;font-family:Consolas,monospace;font-size:12px}
.setor-section + .setor-section{border-top:12px solid var(--bg)}
.setor-title{background:#e8eef5;color:#1f2937;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;padding:10px 12px;border-bottom:1px solid #c7d0dd}
.print-header,.print-footer{display:none}
table{width:100%;border-collapse:collapse;min-width:1040px}
th,td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;font-size:13px;vertical-align:top}
th{position:sticky;top:0;background:#f8fafc;font-size:12px;text-transform:uppercase;color:#475467;z-index:1}
tr.alerta{background:var(--warn)}
tr.bloqueio{background:var(--danger)}
.badge{display:inline-block;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:700;background:#eef6ff;color:#175cd3}
.badge.zero{background:#ffe4e8;color:#b42318}
.badge.enteral{background:#e6f4ea;color:#067647}
.badge.jejum{background:#fff4d6;color:#93370d}
.muted{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .summary{grid-template-columns:repeat(2,1fr)}
  .toolbar{grid-template-columns:1fr}
}
@media print{
  html,body{margin:0!important;background:#fff}
  .topbar,.form,.toolbar,.no-print{display:none!important}
  .app{display:block;padding:0}
  .panel{box-shadow:none;border:0;padding:0}
  .summary{display:none!important}
  .card{box-shadow:none}
  .map{border:0;overflow:visible}
  .setor-section{
    width:100%;
    min-height:188mm;
    page-break-inside:auto;
    break-inside:auto;
    position:relative;
    padding:10mm;
    background:#fff;
  }
  .setor-section + .setor-section{border-top:0;page-break-before:always;break-before:page}
  body.print-setor .summary{display:none!important}
  body.print-setor .setor-section{display:none!important}
  body.print-setor .setor-section.setor-imprimir{display:block!important}
  .print-header{display:block;text-align:center;margin:0 0 5mm}
  .print-logo{width:30mm;height:22mm;object-fit:contain;object-position:center}
  .print-doc-title{font-size:20px;font-weight:800;text-transform:uppercase;margin-top:1.5mm}
  .print-meta{
    display:inline-block;
    font-size:14px;
    font-weight:800;
    margin-top:2mm;
    padding:1.5mm 4mm;
    border:1px solid #333;
    border-radius:4px;
    color:#111;
  }
  .setor-title{font-size:18px;padding:0 0 2mm;margin:0 0 2mm;background:#fff;border-bottom:2px solid #222}
  table{min-width:0;width:100%;table-layout:fixed}
  th,td{font-size:10px;padding:3.5px 3px;line-height:1.18;word-break:break-word;overflow-wrap:anywhere}
  th{position:static;font-size:9px}
  tr{page-break-inside:avoid;break-inside:avoid}
  .muted{font-size:9px;line-height:1.16}
  .badge{font-size:10.5px;padding:3px 6px}
  .print-footer{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    border-top:1px solid #999;
    padding-top:2mm;
    margin-top:8mm;
    page-break-inside:avoid;
    position:static;
  }
  .print-footer img{width:70mm;max-height:20mm;object-fit:contain;object-position:left bottom}
  .print-footer-text{text-align:right;font-size:9pt;line-height:1.28;color:#333}
  @page{size:A4 landscape;margin:6mm}
}
</style>
</head>
<body>
<div class="topbar">Dashboard - Mapa de Dietas</div>
<main class="app">
  <section class="panel form">
    <h2>Paciente</h2>
    <label>Data/hora da internacao</label><input id="internacao" type="datetime-local">
    <label>Setor</label><select id="setor"></select>
    <label>Leito</label><select id="leito"></select>
    <div class="row2">
      <div><label>Horário da refeição</label><select id="status"></select></div>
      <div><label>Prontuario</label><input id="prontuario" autocomplete="off"></div>
    </div>
    <label>Nome</label><input id="nome" autocomplete="off">
    <div class="row2">
      <div><label>Data de nascimento</label><input id="nascimento" type="date"></div>
      <div><label>Idade</label><input id="idade" readonly></div>
    </div>
    <label>Nome da mae</label><input id="mae" autocomplete="off">
    <div class="row2">
      <div><label>Acompanhante</label><select id="acompanhante"></select></div>
      <div><label>Via</label><select id="via"></select></div>
    </div>
    <label>Justificativa da dieta do acompanhante</label><input id="justAcompanhante" placeholder="Ex.: acompanhante autorizado, lactante, necessidade especial">
    <label>Dieta</label><div class="checks" id="dieta"></div>
    <label>Restricao alimentar</label><input id="restricao" placeholder="Ex.: sem lactose, sem sal, triturada">
    <label>Alergias</label><input id="alergias" placeholder="Ex.: leite, ovo, amendoim">
    <label>Observacoes</label><textarea id="obs"></textarea>
    <div class="actions">
      <button id="salvar">Adicionar ao mapa</button>
      <button class="secondary" id="novo">Novo</button>
      <button class="ghost" id="imprimir">Imprimir setor</button>
      <button class="danger" id="excluir">Excluir leito</button>
    </div>
  </section>
  <section class="panel">
    <div class="summary" id="resumo"></div>
    <div class="toolbar">
      <input id="busca" placeholder="Buscar por leito, nome, dieta, restricao ou alergia">
      <select id="filtroSetor"><option value="">Escolha o setor</option></select>
      <select id="filtroDieta"><option value="">Todas as dietas</option></select>
      <button class="secondary no-print" id="imprimirSetor">Imprimir setor</button>
      <button class="secondary no-print" id="imprimirTodos">Imprimir todos</button>
      <button class="ghost no-print" id="limparTudo">Limpar mapa</button>
      <button class="ghost no-print" id="abrirConfig">Configurar areas</button>
    </div>
    <div class="config-panel no-print" id="configPanel">
      <h3>Configuracoes</h3>
      <label>Setores e leitos</label>
      <textarea id="configAreas"></textarea>
      <div class="row2">
        <div><label>Horário da refeição</label><textarea id="configStatus"></textarea></div>
        <div><label>Acompanhante</label><textarea id="configAcompanhante"></textarea></div>
      </div>
      <div class="row2">
        <div><label>Dietas</label><textarea id="configDietas"></textarea></div>
        <div><label>Vias</label><textarea id="configVias"></textarea></div>
      </div>
      <div class="actions">
        <button class="secondary" id="aplicarConfig">Aplicar configuracoes</button>
        <button class="ghost" id="fecharConfig">Fechar</button>
      </div>
    </div>
    <div class="map" id="mapa"></div>
  </section>
</main>
<script>
const CONFIG_SENHA = "mapa2026";
let statusOpcoes = ["Café da manhã","Almoço","Lanche da tarde","Jantar","Ceia"];
let acompanhanteOpcoes = ["Nao","Sim"];
let vias = ["Oral","Sonda","Parenteral","Nao se aplica"];
let dietas = ["Livre","Branda","Pastosa","Liquida","Liquida restrita","Zero Lactose","HAS","DM","DRC","Mamadeira","Neutropenica","Enteral","Parenteral","NPO"];

  "Sala de Sutura - Maca de curativos",
  "Sala do respiratorio - Poltrona 1",

  "Sala do respiratorio - Poltrona 4",
  "Sala do respiratorio - Poltrona 5",
  "Sala do respiratorio - Poltrona 6",

  "Sala do respiratorio - Isolamento Quarto 02",

  "Sala do respiratorio - Leito Iso 03",
  "Sala Pediatria - Berco 1",

  "Sala Amarela feminina - Leito feminino 19",

  "Sala Amarela feminina - Leito feminino 21",
  "Sala Amarela feminina - Leito Iso 01",

  "Sala Amarela feminina - Leito Iso 03",
  "Sala Amarela masculina - Leito masculino 1",
  "Sala Amarela masculina - Leito masculino 2",
  "Sala Amarela masculina - Leito masculino 3",
  "Sala Amarela masculina - Leito masculino 4",
  "Sala Amarela masculina - Leito masculino 5",
  "Sala Amarela masculina - Leito masculino 6",
  "Sala Amarela masculina - Leito masculino 7",
  "Sala Amarela masculina - Leito masculino 8",
  "Sala Amarela masculina - Leito masculino 9",
  "Sala Amarela masculina - Leito masculino 10",
  "Sala Amarela masculina - Leito Iso 01",

  "Sala Psiquiatria - Leito Iso 03",
  "Sala verde - Maca",
  "Sala verde - Poltrona 1",
  "Sala verde - Poltrona 2",
  "Sala verde - Poltrona 3",

  "Sala verde - Poltrona 9",
  "Sala verde - Poltrona 10",
  "Sala verde - Poltrona 11",
  "Sala verde - Poltrona 12",
  "Sala verde - Poltrona 13",
  "Sala verde - Poltrona Extra 01",
  "Sala verde - Poltrona Extra 02",
  "Sala verde - Poltrona Extra 03",
  "Sala verde - Poltrona Extra 04",
  "Sala verde - Poltrona Extra 05",
  "Sala verde - Poltrona Extra 06",
  "Sala verde - Leito Iso 01",
  "Sala verde - Leito Iso 02",
  "Sala verde - Leito Iso 03",
  "Isolamento - Quarto 1",
  "Isolamento - Quarto 2",
  "Sala de Aplicacao"
];
let registros = [];

const $ = id => document.getElementById(id);
const campos = ["leito","status","nome","nascimento","idade","mae","prontuario","setor","acompanhante","justAcompanhante","internacao","dieta","via","restricao","alergias","obs"];

function preencherSelects(){
  $("setor").innerHTML = '<option value="">Selecione</option>' + setores.map(v => `<option>${v}</option>`).join("");
  $("status").innerHTML = statusOpcoes.map(v => `<option>${v}</option>`).join("");
  $("acompanhante").innerHTML = acompanhanteOpcoes.map(v => `<option>${v}</option>`).join("");
  $("via").innerHTML = vias.map(v => `<option>${v}</option>`).join("");
  $("dieta").innerHTML = dietas.map(v => `<label class="check-option"><input type="checkbox" value="${v}">${v}</label>`).join("");
  atualizarLeitosPorSetor();
  $("filtroDieta").innerHTML = '<option value="">Todas as dietas</option>' + dietas.map(v => `<option>${v}</option>`).join("");
}
function leitosDoSetor(setor){
  if(!setor) return [];
  return leitos.filter(leito => leito === setor || leito.startsWith(setor + " - "));
}
function atualizarLeitosPorSetor(selecionado = ""){
  const setor = $("setor").value;
  const opcoes = leitosDoSetor(setor);
  if(!setor){
    $("leito").innerHTML = '<option value="">Selecione o setor primeiro</option>';
    $("leito").disabled = true;
    return;
  }
  $("leito").disabled = false;
  $("leito").innerHTML = '<option value="">Selecione</option>' + opcoes.map(v => `<option>${v}</option>`).join("");
  if(selecionado && opcoes.includes(selecionado)) $("leito").value = selecionado;
}
function atualizarFiltroSetor(){
  const selecionado = $("filtroSetor").value;
  $("filtroSetor").innerHTML = '<option value="">Escolha o setor</option>' + setores.map(v => `<option>${v}</option>`).join("");
  if(setores.includes(selecionado)) $("filtroSetor").value = selecionado;
}
function valorDateTimeLocal(data){
  const pad = n => String(n).padStart(2, "0");
  return `${data.getFullYear()}-${pad(data.getMonth()+1)}-${pad(data.getDate())}T${pad(data.getHours())}:${pad(data.getMinutes())}`;
}
function formatarDateTimeLocal(valor){
  if(!valor) return "";
  const data = new Date(valor);
  if(Number.isNaN(data.getTime())) return valor;
  return data.toLocaleString("pt-BR", {day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit"});
}
function formatarData(valor){
  if(!valor) return "";
  const data = new Date(valor + "T00:00");
  if(Number.isNaN(data.getTime())) return valor;
  return data.toLocaleDateString("pt-BR");
}
function calcularIdade(valor){
  if(!valor) return "";
  const nascimento = new Date(valor + "T00:00");
  if(Number.isNaN(nascimento.getTime())) return "";
  const hoje = new Date();
  let idade = hoje.getFullYear() - nascimento.getFullYear();
  const aniversarioPassou = hoje.getMonth() > nascimento.getMonth() || (hoje.getMonth() === nascimento.getMonth() && hoje.getDate() >= nascimento.getDate());
  if(!aniversarioPassou) idade--;
  return idade >= 0 ? `${idade} anos` : "";
}
function tempoInternacao(valor){
  if(!valor) return "";
  const inicio = new Date(valor);
  if(Number.isNaN(inicio.getTime())) return "";
  const totalMin = Math.max(0, Math.floor((Date.now() - inicio.getTime()) / 60000));
  const dias = Math.floor(totalMin / 1440);
  const horas = Math.floor((totalMin % 1440) / 60);
  const minutos = totalMin % 60;
  if(dias > 0) return `${dias}d ${horas}h`;
  if(horas > 0) return `${horas}h ${minutos}min`;
  return `${minutos}min`;
}
function setorPorLeito(leito){
  if(!leito) return "";
  const setor = setores.find(nome => leito.startsWith(nome));
  if(setor) return setor;
  return "";
}
function textoConfiguracaoAreas(){
  return setores.map(setor => {
    const nomes = leitosDoSetor(setor).map(leito => leito === setor ? setor : leito.replace(setor + " - ", ""));
    return [setor, ...nomes.map(nome => "- " + nome)].join("\n");
  }).join("\n\n");
}
function aplicarTextoConfiguracao(texto){
  const novosSetores = [];
  const novosLeitos = [];
  let setorAtual = "";
  texto.split(/\r?\n/).forEach(linhaOriginal => {
    const linha = linhaOriginal.trim();
    if(!linha) return;
    if(!linha.startsWith("-")){
      setorAtual = linha;
      if(!novosSetores.includes(setorAtual)) novosSetores.push(setorAtual);
      return;
    }
    if(!setorAtual) return;
    const leito = linha.replace(/^-+\s*/, "");
    if(leito) novosLeitos.push(leito === setorAtual ? setorAtual : `${setorAtual} - ${leito}`);
  });
  if(!novosSetores.length || !novosLeitos.length){
    alert("Confira a configuracao. Use o nome do setor e, abaixo, os leitos com '-' no inicio.");
    return;
  }
  setores = novosSetores;
  leitos = novosLeitos;
  preencherSelects();
  desenhar();
  alert("Configuracoes aplicadas nesta sessao.");
}
function linhasLista(id){
  return $(id).value.split(/\r?\n/).map(v => v.trim()).filter(Boolean);
}
function abrirConfiguracoes(){
  const senha = prompt("Digite a senha para configurar as areas:");
  if(senha !== CONFIG_SENHA){
    alert("Senha incorreta.");
    return;
  }
  $("configAreas").value = textoConfiguracaoAreas();
  $("configStatus").value = statusOpcoes.join("\n");
  $("configAcompanhante").value = acompanhanteOpcoes.join("\n");
  $("configDietas").value = dietas.join("\n");
  $("configVias").value = vias.join("\n");
  $("configPanel").classList.add("open");
}
function aplicarTodasConfiguracoes(){
  const novosStatus = linhasLista("configStatus");
  const novosAcompanhante = linhasLista("configAcompanhante");
  const novasDietas = linhasLista("configDietas");
  const novasVias = linhasLista("configVias");
  if(!novosStatus.length || !novosAcompanhante.length || !novasDietas.length || !novasVias.length){
    alert("Confira as listas de horário da refeição, acompanhante, dietas e vias. Nenhuma pode ficar vazia.");
    return;
  }
  statusOpcoes = novosStatus;
  acompanhanteOpcoes = novosAcompanhante;
  dietas = novasDietas;
  vias = novasVias;
  aplicarTextoConfiguracao($("configAreas").value);
}
function dadosFormulario(){
  const item = {};
  campos.forEach(id => {
    if(id === "dieta") return;
    item[id] = $(id).value.trim();
  });
  item.idade = calcularIdade(item.nascimento);
  item.dieta = [...$("dieta").querySelectorAll("input:checked")].map(opcao => opcao.value).join(" + ");
  if(!item.internacao) item.internacao = valorDateTimeLocal(new Date());
  item.atualizadoEm = new Date().toLocaleString("pt-BR");
  return item;
}
function carregarFormulario(item){
  campos.forEach(id => {
    if(id === "leito" || id === "dieta") return;
    $(id).value = item && item[id] ? item[id] : "";
  });
  const dietasItem = item && item.dieta ? item.dieta.split(" + ").map(v => v.trim()) : [];
  [...$("dieta").querySelectorAll("input[type='checkbox']")].forEach(opcao => opcao.checked = dietasItem.includes(opcao.value));
  $("idade").value = calcularIdade(item && item.nascimento ? item.nascimento : $("nascimento").value);
  atualizarLeitosPorSetor(item && item.leito ? item.leito : "");
  if(!item) $("status").value = statusOpcoes[0] || "";
  if(!item) $("via").value = vias[0] || "";
  if(!item) $("acompanhante").value = acompanhanteOpcoes[0] || "";
  if(!item) $("internacao").value = valorDateTimeLocal(new Date());
}
function salvar(){
  const item = dadosFormulario();
  if(!item.setor){ alert("Selecione o setor."); return; }
  if(!item.leito){ alert("Selecione o leito."); return; }
  if(!item.dieta){ alert("Selecione pelo menos uma dieta."); return; }
  const idx = registros.findIndex(r => r.leito === item.leito);
  if(idx >= 0) registros[idx] = item; else registros.push(item);
  registros.sort(compararRegistros);
  desenhar();
  carregarFormulario(null);
  $("leito").focus();
}
function excluir(){
  const leito = $("leito").value;
  if(!leito) return;
  if(!confirm("Excluir os dados deste leito?")) return;
  registros = registros.filter(r => r.leito !== leito);
  carregarFormulario(null);
  desenhar();
}
function classeDieta(dieta){
  const d = dieta.toLowerCase();
  if(d.includes("zero")) return "zero";
  if(d.includes("enteral") || d.includes("parenteral")) return "enteral";
  if(d.includes("npo")) return "jejum";
  return "";
}
function filtrados(){
  const q = $("busca").value.trim().toLowerCase();
  const filtro = $("filtroDieta").value;
  const setorFiltro = $("filtroSetor").value;
  return registros.filter(r => {
    const texto = campos.map(c => r[c] || "").join(" ").toLowerCase();
    const setor = r.setor || "Sem setor";
    return (!q || texto.includes(q)) && (!filtro || (r.dieta || "").split(" + ").includes(filtro)) && (!setorFiltro || setor === setorFiltro);
  });
}
function compararRegistros(a,b){
  const setorA = (a.setor || "Sem setor").localeCompare(b.setor || "Sem setor", "pt-BR");
  if(setorA !== 0) return setorA;
  return leitos.indexOf(a.leito) - leitos.indexOf(b.leito);
}
function desenharResumo(lista){
  const restricoes = registros.filter(r => r.restricao || r.alergias).length;
  const zeroJejum = registros.filter(r => ["Zero Lactose","NPO"].some(dieta => (r.dieta || "").split(" + ").includes(dieta))).length;
  const enterais = registros.filter(r => ["Enteral","Parenteral"].some(dieta => (r.dieta || "").split(" + ").includes(dieta))).length;
  $("resumo").innerHTML = [
    ["Pacientes", registros.length],
    ["Restricoes/alertas", restricoes],
    ["Zero/NPO", zeroJejum],
    ["Enteral/parenteral", enterais],
    ["Exibidos", lista.length]
  ].map(([t,n]) => `<div class="card"><div class="n">${n}</div><div class="t">${t}</div></div>`).join("");
}

  </section>`).join("");
  document.querySelectorAll("tbody tr[data-leito]").forEach(tr => tr.addEventListener("click", () => {
    const item = registros.find(r => r.leito === tr.dataset.leito);
    carregarFormulario(item);
  }));
}
function limparModoImpressao(){
  document.body.classList.remove("print-setor");
  document.querySelectorAll(".setor-imprimir").forEach(el => el.classList.remove("setor-imprimir"));
}
function preloadLogosImpressao(){
  ["assets/mao-amiga-logo-cortado.jpeg", "assets/upa-sus-rodape-sem-ona.jpeg"].forEach(src => {
    const img = new Image();
    img.src = src;
  });
}
function atualizarDataImpressao(){
  const texto = "Emitido em " + new Date().toLocaleString("pt-BR");
  document.querySelectorAll(".print-meta").forEach(el => el.textContent = texto);
}
function imprimirComLogos(){
  atualizarDataImpressao();
  window.print();
}
function imprimirSetor(){
  const setor = $("filtroSetor").value;
  if(!setor){
    alert("Escolha um setor antes de imprimir.");
    return;
  }
  limparModoImpressao();
  const secao = [...document.querySelectorAll(".setor-section")].find(el => el.dataset.setor === setor);
  if(!secao){
    alert("Este setor nao tem pacientes para imprimir.");
    return;
  }
  secao.classList.add("setor-imprimir");
  document.body.classList.add("print-setor");
  imprimirComLogos();
}
function imprimirTodos(){
  if(!registros.length){
    alert("Nao ha pacientes no mapa para imprimir.");
    return;
  }
  limparModoImpressao();
  imprimirComLogos();
}
function limitarDietas(){
  const selecionadas = [...$("dieta").querySelectorAll("input:checked")];
  if(selecionadas.length <= 4) return;
  selecionadas[selecionadas.length - 1].checked = false;
  alert("Selecione no máximo 4 opções de dieta.");
}

preencherSelects();
preloadLogosImpressao();
$("salvar").addEventListener("click", salvar);
$("novo").addEventListener("click", () => carregarFormulario(null));
$("excluir").addEventListener("click", excluir);
$("imprimir").addEventListener("click", imprimirSetor);
$("imprimirSetor").addEventListener("click", imprimirSetor);
$("imprimirTodos").addEventListener("click", imprimirTodos);
$("abrirConfig").addEventListener("click", abrirConfiguracoes);
$("aplicarConfig").addEventListener("click", aplicarTodasConfiguracoes);
$("fecharConfig").addEventListener("click", () => $("configPanel").classList.remove("open"));
$("limparTudo").addEventListener("click", () => {
  if(!confirm("Limpar todo o mapa de dietas?")) return;
  registros = [];
  carregarFormulario(null);
  desenhar();
});
$("busca").addEventListener("input", desenhar);
$("filtroSetor").addEventListener("change", desenhar);
$("filtroDieta").addEventListener("change", desenhar);
window.addEventListener("afterprint", limparModoImpressao);
$("setor").addEventListener("change", () => atualizarLeitosPorSetor());
$("nascimento").addEventListener("input", () => $("idade").value = calcularIdade($("nascimento").value));
$("nascimento").addEventListener("change", () => $("idade").value = calcularIdade($("nascimento").value));
$("dieta").addEventListener("change", limitarDietas);
$("leito").addEventListener("change", () => {
  const item = registros.find(r => r.leito === $("leito").value);
  if(item){
    carregarFormulario(item);
  }
});
carregarFormulario(null);
desenhar();
</script>
</body>
</html>
